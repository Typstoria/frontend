Повертай стислий результат: висновок, конкретні файли й символи, залежності та невизначеності.
Відокремлюй підтверджені факти від припущень. Якщо завдання потребує складного аналізу,
поясни координатору, що саме потрібно перевірити сильнішою моделлю.
"""
